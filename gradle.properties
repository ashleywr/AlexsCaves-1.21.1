# The Gradle daemon runs on JDK 21, pinned by gradle/gradle-daemon-jvm.properties
# (regenerate with `gradlew updateDaemonJvm --jvm-version=21`). Gradle 8.12 predates
# JDK 25 support: on a 25 daemon it cannot even instantiate the Test task
# (DefaultReportContainer -> "Type T not present"), which fails `check` and takes
# `build` down before it reaches `deploy`. The compile toolchain is 21 either way,
# so nothing here wants a newer JVM.
# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
jei_version=19.21.2.313
jei_mc_version=1.21.1
